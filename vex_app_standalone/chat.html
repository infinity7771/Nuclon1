<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEX OS · Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* ============================================================
   VEX OS — shared.css
   Estilos compartidos para páginas fuera del iPhone
============================================================ */
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;}
*::-webkit-scrollbar{display:none;}

:root{
  --bg:#090909;
  --s1:#111116;
  --s2:#18181f;
  --line:#24242b;
  --line2:#2e2e38;
  --ink:#F2F0EB;
  --muted:#6a6a72;
  --muted2:#3e3e47;
  --accent:#D9D4C7;
  --green:#3d9970;
  --yellow:#c8a84b;
  --red:#c0392b;
  --nav-h:64px;
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Geist',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

/* ---- Partículas ---- */
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.speck{
  position:absolute;bottom:-4px;width:1.5px;height:1.5px;border-radius:50%;
  background:rgba(242,240,235,0.15);animation:drift linear infinite;
}
@keyframes drift{
  0%{transform:translateY(0) translateX(0);opacity:0;}
  10%{opacity:1;}90%{opacity:1;}
  100%{transform:translateY(-110vh) translateX(var(--dx,20px));opacity:0;}
}

/* ============================================================
   NAVBAR
============================================================ */
.navbar{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);
  background:rgba(9,9,9,.85);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;z-index:100;
}
.nav-logo{
  font-size:18px;font-weight:800;letter-spacing:.1em;
  color:var(--ink);text-decoration:none;
}
.nav-links{
  display:flex;align-items:center;gap:32px;
}
.nav-links a{
  font-size:12px;font-weight:500;letter-spacing:.06em;
  color:var(--muted);text-decoration:none;transition:.2s;
}
.nav-links a:hover{color:var(--ink);}
.nav-links a.active{color:var(--ink);border-bottom:1px solid var(--accent);padding-bottom:2px;}
.nav-cta{
  display:flex;align-items:center;gap:10px;
}
.btn-nav-ghost{
  padding:8px 18px;border:1px solid var(--line);border-radius:10px;
  font-size:12px;font-weight:600;color:var(--muted);
  text-decoration:none;transition:.2s;letter-spacing:.06em;
  background:transparent;cursor:pointer;font-family:'Geist',sans-serif;
}
.btn-nav-ghost:hover{border-color:var(--line2);color:var(--ink);}
.btn-nav-solid{
  padding:8px 18px;background:var(--accent);border:none;border-radius:10px;
  font-size:12px;font-weight:700;color:var(--bg);
  text-decoration:none;transition:.15s;letter-spacing:.06em;
  cursor:pointer;font-family:'Geist',sans-serif;
}
.btn-nav-solid:hover{opacity:.9;}

/* Mobile nav toggle */
.nav-mobile-toggle{
  display:none;background:none;border:none;cursor:pointer;
  color:var(--muted);padding:4px;
}
@media(max-width:700px){
  .navbar{padding:0 20px;}
  .nav-links{display:none;}
  .nav-mobile-toggle{display:block;}
}

/* ============================================================
   PAGE WRAPPER
============================================================ */
.page{
  padding-top:var(--nav-h);
  min-height:100vh;
  position:relative;z-index:1;
}

/* ============================================================
   COMMON SECTIONS
============================================================ */
.section{
  max-width:1100px;
  margin:0 auto;
  padding:80px 40px;
}
@media(max-width:700px){.section{padding:60px 20px;}}

.section-label{
  font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px;
}
.section-title{
  font-size:clamp(28px,5vw,48px);font-weight:800;
  letter-spacing:-.02em;line-height:1.15;color:var(--ink);
  margin-bottom:14px;
}
.section-sub{
  font-size:16px;color:var(--muted);line-height:1.7;
  max-width:560px;
}

/* Divider */
.divider{border:none;border-top:1px solid var(--line);margin:0;}

/* Cards */
.card{
  background:var(--s1);border:1px solid var(--line);
  border-radius:16px;padding:24px;
}
.card:hover{border-color:var(--line2);}

/* ============================================================
   BUTTONS (full-page)
============================================================ */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 28px;border-radius:12px;
  font-size:13px;font-weight:700;letter-spacing:.08em;
  font-family:'Geist',sans-serif;cursor:pointer;
  text-decoration:none;transition:.15s;border:none;
}
.btn-primary{background:var(--accent);color:var(--bg);}
.btn-primary:hover{opacity:.9;}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--line2);}

/* ============================================================
   FOOTER
============================================================ */
.footer{
  border-top:1px solid var(--line);
  padding:32px 40px;
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:16px;
  position:relative;z-index:1;
}
.footer-logo{font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--ink);}
.footer-links{display:flex;gap:24px;}
.footer-links a{font-size:11px;color:var(--muted);text-decoration:none;letter-spacing:.06em;transition:.2s;}
.footer-links a:hover{color:var(--ink);}
.footer-copy{font-size:10px;color:var(--muted2);letter-spacing:.06em;}
@media(max-width:600px){.footer{padding:24px 20px;flex-direction:column;text-align:center;}}

/* ============================================================
   FORM INPUTS (login, etc)
============================================================ */
.form-card{
  background:var(--s1);border:1px solid var(--line);
  border-radius:20px;padding:32px;width:100%;max-width:420px;
}
.form-field{margin-bottom:16px;}
.form-field label{
  display:block;font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin-bottom:7px;
}
.form-field input,.form-field select{
  width:100%;background:var(--s2);border:1px solid var(--line);
  border-radius:10px;padding:13px 16px;
  font-size:14px;color:var(--ink);font-family:'Geist',sans-serif;
  outline:none;transition:border-color .2s;
}
.form-field input:focus,.form-field select:focus{border-color:var(--line2);}
.form-tabs{
  display:flex;background:var(--s2);border:1px solid var(--line);
  border-radius:12px;padding:4px;margin-bottom:24px;gap:4px;
}
.form-tab{
  flex:1;padding:9px;border:none;background:transparent;
  font-family:'Geist',sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.08em;color:var(--muted);cursor:pointer;
  border-radius:9px;transition:.2s;
}
.form-tab.active{background:var(--s1);color:var(--ink);border:1px solid var(--line);}
.form-error{
  font-size:11px;color:var(--red);display:none;
  padding:8px 12px;background:rgba(192,57,43,.08);
  border:1px solid rgba(192,57,43,.25);border-radius:8px;margin-bottom:12px;
}
.form-error.show{display:block;}
.form-note{
  font-size:10px;color:var(--muted);line-height:1.6;
  margin-top:16px;padding:12px;background:var(--s2);
  border:1px solid var(--line);border-radius:10px;
}
.form-note b{color:var(--muted2);}

/* ============================================================
   DASHBOARD LAYOUT
============================================================ */
.app-layout{
  display:flex;min-height:calc(100vh - var(--nav-h));
  padding-top:var(--nav-h);
}
.sidebar{
  width:220px;flex-shrink:0;
  border-right:1px solid var(--line);
  padding:24px 16px;
  position:fixed;top:var(--nav-h);left:0;bottom:0;
  overflow-y:auto;background:var(--bg);z-index:40;
}
.sidebar-section{margin-bottom:28px;}
.sidebar-label{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted2);margin-bottom:10px;padding:0 8px;}
.sidebar-link{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:10px;
  font-size:13px;color:var(--muted);text-decoration:none;
  transition:.15s;cursor:pointer;border:none;background:none;width:100%;
  font-family:'Geist',sans-serif;
}
.sidebar-link:hover{background:var(--s1);color:var(--ink);}
.sidebar-link.active{background:var(--s2);color:var(--ink);border:1px solid var(--line);}
.sidebar-link svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0;}
.sidebar-link .badge-count{
  margin-left:auto;font-size:9px;background:var(--accent);
  color:var(--bg);border-radius:20px;padding:2px 7px;font-weight:700;
}
.main-content{
  margin-left:220px;flex:1;padding:32px;
  max-width:calc(100vw - 220px);
}
@media(max-width:900px){
  .sidebar{display:none;}
  .main-content{margin-left:0;max-width:100%;padding:20px;}
}

/* ============================================================
   PROFILE CARDS
============================================================ */
.profile-card{
  background:var(--s1);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;transition:.2s;cursor:pointer;
}
.profile-card:hover{border-color:var(--line2);transform:translateY(-2px);}
.pc-banner{height:60px;background:linear-gradient(135deg,var(--s2),var(--line));position:relative;}
.pc-av{
  width:52px;height:52px;border-radius:50%;
  background:var(--s1);border:2px solid var(--bg);
  position:absolute;bottom:-26px;left:16px;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  overflow:hidden;
}
.pc-av img{width:100%;height:100%;object-fit:cover;}
.pc-body{padding:34px 16px 16px;}
.pc-name{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.04em;}
.pc-handle{font-size:11px;color:var(--muted);margin-top:2px;}
.pc-tags{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0;}
.pc-tag{font-size:9px;padding:3px 8px;border-radius:20px;background:var(--s2);border:1px solid var(--line);color:var(--muted);}
.pc-games{display:flex;gap:4px;margin-top:8px;}
.pc-game{width:28px;height:28px;border-radius:8px;background:var(--s2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;}
.pc-footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.pc-compat{font-size:12px;font-weight:700;color:var(--accent);}
.pc-status{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);}
.pc-dot{width:6px;height:6px;border-radius:50%;}
.pc-dot.online{background:var(--green);}
.pc-dot.away{background:var(--yellow);}
.pc-dot.offline{background:var(--muted2);}

/* ============================================================
   STAT CARDS
============================================================ */
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
@media(max-width:800px){.stat-cards{grid-template-columns:repeat(2,1fr);}}
.stat-card{
  background:var(--s1);border:1px solid var(--line);
  border-radius:16px;padding:18px 20px;
}
.sc-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.sc-value{font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-.02em;}
.sc-sub{font-size:11px;color:var(--muted);margin-top:4px;}
.sc-trend{font-size:11px;color:var(--green);margin-top:4px;}

/* ============================================================
   ACTIVITY FEED
============================================================ */
.activity-item{
  display:flex;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--line);
}
.activity-item:last-child{border-bottom:none;}
.act-icon{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:var(--s2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.act-content{flex:1;min-width:0;}
.act-text{font-size:13px;color:var(--ink);line-height:1.4;}
.act-time{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.04em;}

/* ============================================================
   SEARCH & FILTERS
============================================================ */
.search-bar{
  display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;
}
.search-input-wrap{
  flex:1;min-width:200px;position:relative;
}
.search-input-wrap svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;stroke:var(--muted);
}
.search-input{
  width:100%;background:var(--s1);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px 12px 40px;
  font-size:14px;color:var(--ink);font-family:'Geist',sans-serif;outline:none;transition:.2s;
}
.search-input:focus{border-color:var(--line2);}
.filter-btn{
  padding:11px 16px;background:var(--s1);border:1px solid var(--line);
  border-radius:12px;font-size:12px;color:var(--muted);cursor:pointer;
  font-family:'Geist',sans-serif;transition:.2s;white-space:nowrap;
}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--ink);}

/* ============================================================
   SECTION HEADER
============================================================ */
.sec-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;
}
.sec-header h2{font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.01em;}
.sec-header a{font-size:12px;color:var(--muted);text-decoration:none;transition:.2s;}
.sec-header a:hover{color:var(--ink);}

/* ============================================================
   SETTINGS
============================================================ */
.settings-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 0;border-bottom:1px solid var(--line);
}
.settings-row:last-child{border-bottom:none;}
.settings-info .settings-title{font-size:13px;color:var(--ink);font-weight:500;}
.settings-info .settings-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.toggle{
  width:44px;height:24px;border-radius:12px;background:var(--line);
  border:none;cursor:pointer;position:relative;transition:.2s;flex-shrink:0;
}
.toggle.on{background:var(--green);}
.toggle::after{
  content:'';position:absolute;top:3px;left:3px;
  width:18px;height:18px;border-radius:50%;background:white;
  transition:transform .2s;
}
.toggle.on::after{transform:translateX(20px);}
.danger-zone{
  background:rgba(192,57,43,.06);border:1px solid rgba(192,57,43,.2);
  border-radius:16px;padding:20px;margin-top:24px;
}
.danger-zone h3{font-size:14px;font-weight:700;color:var(--red);margin-bottom:14px;}
.btn-danger{
  padding:10px 20px;background:transparent;border:1px solid var(--red);
  border-radius:10px;font-size:12px;color:var(--red);cursor:pointer;
  font-family:'Geist',sans-serif;transition:.2s;
}
.btn-danger:hover{background:rgba(192,57,43,.1);}
</style>
<style>
/* ══ LAYOUT FULL HEIGHT ══ */
body{overflow:hidden;}
.chat-wrap{
  display:flex;height:calc(100vh - 64px);
  margin-top:64px;overflow:hidden;
}

/* ══ CONV SIDEBAR (left) ══ */
.conv-sidebar{
  width:280px;flex-shrink:0;
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  background:var(--bg);
}
@media(max-width:700px){
  .conv-sidebar{width:100%;position:absolute;left:0;top:64px;bottom:0;z-index:30;transition:.3s;}
  .conv-sidebar.hidden{transform:translateX(-100%);}
}
.conv-sidebar-head{
  padding:16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.conv-sidebar-head h2{font-size:14px;font-weight:700;color:var(--ink);}
.icon-btn{
  width:30px;height:30px;border-radius:8px;background:var(--s1);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.15s;color:var(--muted);
}
.icon-btn:hover{border-color:var(--line2);color:var(--ink);}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}

/* Search */
.conv-search{padding:10px 14px;border-bottom:1px solid var(--line);position:relative;}
.conv-search svg{position:absolute;left:24px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--muted);fill:none;}
.conv-search-input{
  width:100%;background:var(--s1);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px 8px 34px;
  font-size:13px;color:var(--ink);font-family:'Geist',sans-serif;outline:none;
}
.conv-search-input:focus{border-color:var(--line2);}

/* Section labels */
.conv-label{
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted2);padding:10px 14px 4px;
}

/* Conv list */
.conv-list{flex:1;overflow-y:auto;}
.conv-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;cursor:pointer;transition:.15s;position:relative;
}
.conv-item:hover{background:var(--s1);}
.conv-item.active{background:var(--s2);}
.conv-item.unread .conv-name{color:var(--ink);font-weight:600;}
.conv-item.unread .conv-last{color:var(--ink);}

.conv-av{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:var(--s2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;
  position:relative;
}
.conv-av.group{border-radius:12px;}
.conv-dot{
  position:absolute;bottom:-1px;right:-1px;
  width:10px;height:10px;border-radius:50%;
  border:2px solid var(--bg);
}
.conv-dot.online{background:var(--green);}
.conv-dot.away{background:var(--yellow);}
.conv-dot.offline{background:var(--muted2);}

.conv-info{flex:1;min-width:0;}
.conv-name{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv-last{font-size:11px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.conv-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.conv-time{font-size:9px;color:var(--muted2);}
.conv-badge{
  min-width:18px;height:18px;border-radius:9px;
  background:var(--red);color:#fff;
  font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 5px;
}

/* ══ MAIN CHAT AREA ══ */
.chat-main{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  background:var(--s0);
}

/* Chat header */
.chat-header{
  padding:14px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;flex-shrink:0;
  background:var(--bg);
}
.chat-header-av{
  width:34px;height:34px;border-radius:50%;background:var(--s2);
  border:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-size:15px;flex-shrink:0;position:relative;
}
.chat-header-av.group{border-radius:10px;}
.chat-header-dot{
  position:absolute;bottom:-1px;right:-1px;
  width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);
}
.chat-header-info{flex:1;min-width:0;}
.chat-header-name{font-size:14px;font-weight:700;color:var(--ink);}
.chat-header-status{font-size:11px;color:var(--muted);margin-top:1px;}
.chat-header-actions{display:flex;gap:6px;}

/* Back button (mobile) */
.back-btn{
  display:none;width:30px;height:30px;border-radius:8px;
  background:var(--s1);border:1px solid var(--line);
  align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.back-btn svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;}
@media(max-width:700px){.back-btn{display:flex;}}

/* Messages */
.chat-messages{
  flex:1;overflow-y:auto;padding:16px 20px;
  display:flex;flex-direction:column;gap:2px;
}
.chat-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--muted2);font-size:13px;gap:8px;
}
.chat-empty-icon{font-size:40px;}

/* Date divider */
.date-divider{
  display:flex;align-items:center;gap:10px;
  margin:14px 0 8px;
}
.date-divider::before,.date-divider::after{content:'';flex:1;height:1px;background:var(--line);}
.date-divider span{font-size:10px;color:var(--muted2);white-space:nowrap;letter-spacing:.06em;}

/* Message */
.msg{display:flex;gap:10px;padding:3px 0;position:relative;}
.msg:hover .msg-actions{opacity:1;}
.msg.mine{flex-direction:row-reverse;}
.msg-av{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;margin-top:2px;
  background:var(--s2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;
}
.msg.mine .msg-av{display:none;}
.msg-content{max-width:72%;min-width:0;}
.msg.mine .msg-content{display:flex;flex-direction:column;align-items:flex-end;}
.msg-author{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:3px;}
.msg.mine .msg-author{display:none;}
.msg-bubble{
  background:var(--s1);border:1px solid var(--line);border-radius:16px;
  padding:9px 14px;font-size:13px;color:var(--ink);line-height:1.5;
  word-break:break-word;position:relative;
}
.msg.mine .msg-bubble{
  background:var(--s2);border-color:var(--line2);
  border-radius:16px 4px 16px 16px;
}
.msg:not(.mine) .msg-bubble{border-radius:4px 16px 16px 16px;}
.msg-time{font-size:9px;color:var(--muted2);margin-top:3px;letter-spacing:.03em;}

/* Reactions */
.msg-reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.reaction{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:12px;
  background:var(--s2);border:1px solid var(--line);
  font-size:12px;cursor:pointer;transition:.15s;
}
.reaction:hover{border-color:var(--line2);}
.reaction.mine{border-color:rgba(217,212,199,.3);background:rgba(217,212,199,.06);}
.reaction span{font-size:10px;color:var(--muted);}

/* Message actions (hover) */
.msg-actions{
  position:absolute;top:-16px;right:0;
  background:var(--s1);border:1px solid var(--line);border-radius:10px;
  display:flex;gap:2px;padding:3px;
  opacity:0;transition:opacity .15s;pointer-events:none;
  z-index:5;
}
.msg:hover .msg-actions{pointer-events:all;}
.msg-action-btn{
  width:26px;height:26px;border-radius:6px;border:none;background:transparent;
  cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;
  transition:.15s;color:var(--muted);
}
.msg-action-btn:hover{background:var(--s2);color:var(--ink);}

/* Typing indicator */
.typing{
  display:none;align-items:center;gap:8px;
  padding:0 20px 8px;font-size:11px;color:var(--muted);
}
.typing.visible{display:flex;}
.typing-dots{display:flex;gap:3px;}
.typing-dots span{
  width:5px;height:5px;border-radius:50%;background:var(--muted2);
  animation:typingDot 1.2s ease-in-out infinite;
}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes typingDot{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-4px);}}

/* Input area */
.chat-input-wrap{
  padding:12px 16px;border-top:1px solid var(--line);
  background:var(--bg);flex-shrink:0;
}
.chat-input-row{

<script>/* ============================================================
   VEX OS — auth.js
   Login, register, session helpers
============================================================ */

function hashSimple(s){
  let h=0;
  for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))&0xFFFFFF;
  return h.toString(16);
}

function getAccounts(){ return JSON.parse(localStorage.getItem('vex_accounts')||'{}'); }
function setAccounts(a){ localStorage.setItem('vex_accounts',JSON.stringify(a)); }
function getSession(){ return JSON.parse(localStorage.getItem('vex_user')||'null'); }
function setSession(u){ localStorage.setItem('vex_user',JSON.stringify(u)); }
function clearSession(){ localStorage.removeItem('vex_user'); }
function isLoggedIn(){ return !!getSession(); }

function doLogin(user, pass, errEl){
  user=user.trim().toLowerCase();
  if(!user||!pass){ showErr(errEl,'Completa todos los campos'); return false; }
  const accounts=getAccounts();
  if(!accounts[user]){ showErr(errEl,'Usuario no encontrado'); return false; }
  if(accounts[user].passHash!==hashSimple(pass)){ showErr(errEl,'Contraseña incorrecta'); return false; }
  setSession(accounts[user]);
  // Sync vex_profile with account data
  localStorage.setItem('vex_profile', JSON.stringify(accounts[user].profile||{}));
  return true;
}

function doRegister(data, errEl){
  const {username, pass, age, country, lang, schedule}=data;
  const key=username.trim().toLowerCase();
  if(!key||!pass||!age||!country){ showErr(errEl,'Completa todos los campos'); return false; }
  if(isNaN(age)||parseInt(age)<14){ showErr(errEl,'Debes tener al menos 14 años'); return false; }
  if(pass.length<6){ showErr(errEl,'Contraseña mínimo 6 caracteres'); return false; }
  if(!/^[a-zA-Z0-9_]+$/.test(key)){ showErr(errEl,'Username: solo letras, números y _'); return false; }
  const accounts=getAccounts();
  if(accounts[key]){ showErr(errEl,'Username ya en uso'); return false; }

  const profile={
    name: username, username: key, bio:'', country, lang, schedule,
    status:'online', avatar:'', games:[], music:[], socials:{}, setupDone:false
  };
  const account={ username:key, passHash:hashSimple(pass), age:parseInt(age), createdAt:Date.now(), profile };
  accounts[key]=account;
  setAccounts(accounts);
  setSession(account);
  localStorage.setItem('vex_profile', JSON.stringify(profile));
  return true;
}

function showErr(el, msg){
  if(!el) return;
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 4000);
}

function requireAuth(redirect='login.html'){
  if(!isLoggedIn()) window.location.href=redirect;
}

function logout(){
  clearSession();
  window.location.href='index.html';
}

// Spawn background particles (shared utility)
function spawnParticles(containerId='ambient', count=20){
  const amb=document.getElementById(containerId);
  if(!amb) return;
  for(let i=0;i<count;i++){
    const s=document.createElement('div'); s.className='speck';
    s.style.left=Math.random()*100+'vw';
    s.style.setProperty('--dx',(Math.random()*60-30)+'px');
    s.style.animationDuration=(12+Math.random()*14)+'s';
    s.style.animationDelay=(Math.random()*16)+'s';
    amb.appendChild(s);
  }
}
</script>

/* ── Render conv list ── */
let currentConv = null;
let typingTimer = null;

function getLastMsg(id){
  const msgs = JSON.parse(localStorage.getItem('vex_chat_'+id) || '[]');
  const last = msgs[msgs.length-1];
  if(!last) return 'Sin mensajes aún';
  const text = last.from==='me' ? '✓ '+last.text : last.text;
  return text.length>35 ? text.slice(0,35)+'...' : text;
}

function renderConvList(filter=''){
  const el = document.getElementById('convList');
  const filtered = CONVS.filter(c =>
    !filter || c.name.toLowerCase().includes(filter.toLowerCase())
  );

  // Group DMs vs Groups
  const dms    = filtered.filter(c=>c.type==='dm');
  const groups = filtered.filter(c=>c.type==='group');

  let html = '';
  if(dms.length){
    html += `<div class="conv-label">Mensajes directos</div>`;
    html += dms.map(c => convItemHtml(c)).join('');
  }
  if(groups.length){
    html += `<div class="conv-label">Grupos</div>`;
    html += groups.map(c => convItemHtml(c)).join('');
  }
  el.innerHTML = html;
}

function convItemHtml(c){
  const dotColor = {online:'online',away:'away',offline:'offline'}[c.status];
  const isActive = currentConv?.id === c.id;
  return `<div class="conv-item ${c.unread?'unread':''} ${isActive?'active':''}" onclick="openConv('${c.id}')">
    <div class="conv-av ${c.type==='group'?'group':''}">
      ${c.emoji}
      ${c.type==='dm'?`<div class="conv-dot ${dotColor}"></div>`:''}

      <div class="conv-name">${c.name}</div>
      <div class="conv-last">${getLastMsg(c.id)}</div>
    </div>
    <div class="conv-meta">
      <div class="conv-time">hoy</div>
      ${c.unread ? `<div class="conv-badge">${c.unread}</div>` : ''}
    </div>
  </div>`;
}

function filterConvs(){
  renderConvList(document.getElementById('searchConv').value);
}

/* ── Open conversation ── */
function openConv(id){
  currentConv = CONVS.find(c=>c.id===id);
  if(!currentConv) return;

  // Clear unread
  currentConv.unread = 0;

  // Show chat area
  document.getElementById('noConv').style.display = 'none';
  const ac = document.getElementById('activeChat');
  ac.style.display = 'flex';

  // Header
  const dotColor = {online:'var(--green)',away:'var(--yellow)',offline:'var(--muted2)'}[currentConv.status];
  document.getElementById('chAv').innerHTML = currentConv.emoji +
    (currentConv.type==='dm' ? `<div class="chat-header-dot" style="background:${dotColor};"></div>` : '');
  document.getElementById('chAv').className = 'chat-header-av' + (currentConv.type==='group'?' group':'');
  document.getElementById('chName').textContent = currentConv.name;
  document.getElementById('chStatus').textContent = currentConv.statusTxt;

  document.getElementById('msgInput').placeholder = `Mensaje a ${currentConv.name}...`;

  renderMessages();
  renderConvList();

  // Mobile: hide sidebar
  if(window.innerWidth <= 700){
    document.getElementById('convSidebar').classList.add('hidden');
  }

  // Simulate typing occasionally in DMs

  }

function showConvList(){
  document.getElementById('convSidebar').classList.remove('hidden');
}

/* ── Render messages ── */
function renderMessages(){
  if(!currentConv) return;
  const msgs = JSON.parse(localStorage.getItem('vex_chat_'+currentConv.id) || '[]');
  const el = document.getElementById('chatMessages');

  if(!msgs.length){
    el.innerHTML = `<div class="chat-empty"><div class="chat-empty-icon">👋</div>Empieza la conversación con ${currentConv.name}</div>`;
    return;
  }

  // Group by date
  let lastDate = null;
  let html = '';
  msgs.forEach((m,i) => {
    const date = m.date || 'Hoy';
    if(date !== lastDate){
      html += `<div class="date-divider"><span>${date}</span></div>`;
      lastDate = date;
    }

    const isMe = m.from === 'me';
    const prevMsg = msgs[i-1];
    const sameAuthor = prevMsg && prevMsg.from === m.from;
    const av = isMe ? '' : `<div class="msg-av">${currentConv.emoji}</div>`;
    const author = (isMe || sameAuthor) ? '' : `<div class="msg-author">${m.from}</div>`;

    const reactions = m.reactions?.map(r =>
      `<div class="reaction ${r.mine?'mine':''}" onclick="addReaction(${i},'${r.e}')">
        ${r.e}<span>${r.n}</span>
      </div>`
    ).join('') || '';

    html += `<div class="msg ${isMe?'mine':''}" id="msg-${i}">
      ${av}
      <div class="msg-content">
        ${author}
        <div class="msg-bubble">
          ${m.text}
          <div class="msg-actions">
            <button class="msg-action-btn" onclick="quickReact(${i},'🔥')" title="Reaccionar 🔥">🔥</button>
            <button class="msg-action-btn" onclick="quickReact(${i},'💎')" title="Reaccionar 💎">💎</button>
            <button class="msg-action-btn" onclick="openReactMenu(${i})" title="Más reacciones">+</button>
            ${isMe ? `<button class="msg-action-btn" onclick="deleteMsg(${i})" title="Borrar" style="color:var(--red);">🗑</button>` : ''}
          </div>
        </div>
        ${reactions ? `<div class="msg-reactions">${reactions}</div>` : ''}
        <div class="msg-time">${m.time}</div>
      </div>
    </div>`;
  });

  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

/* ── Send message ── */
function sendMessage(){
  const input = document.getElementById('msgInput');
  const text  = input.value.trim();
  if(!text || !currentConv) return;

  const msgs = JSON.parse(localStorage.getItem('vex_chat_'+currentConv.id) || '[]');
  const now  = new Date();
  msgs.push({
    from:'me',
    text,
    time: now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0'),
    date:'Hoy'
  });
  localStorage.setItem('vex_chat_'+currentConv.id, JSON.stringify(msgs));

  input.value = '';
  input.style.height = 'auto';
  renderMessages();
  renderConvList();

  // Simulate reply in DMs
  if(currentConv.type==='dm' && currentConv.status==='online'){
    setTimeout(() => { showTyping(); }, 800 + Math.random()*1200);
    setTimeout(() => {
      hideTyping();
      simulateReply();
    }, 2500 + Math.random()*2000);
  }
}

function handleKey(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
}

function autoResize(el){
  el.style.height='auto';

function scheduleTyping(){
  clearTimeout(typingTimer);

    if(currentConv && currentConv.status==='online' && currentConv.type==='dm'){
      showTyping();
      setTimeout(hideTyping, 2200);

/* ── Simulate reply ── */
const REPLIES = {
  nx_kira:['jajaja bro 😂','que dice?','dale vamos 🔥','gg bro','en eso andamos','+1','💎💎','a ver a ver'],
  zeph_gg:['ta bien','dale','cuando?','oye bro','sip','gg'],
  mxrk:['ok','entendido','avisame'],
  rex_plays:['grabando','dale bro','perfecto'],
  apex_squad:['👑','🔥🔥','dale','vamos','GG'],
  rbx_crew:['ok!','dale','cuando?'],
};
function simulateReply(){
  if(!currentConv) return;
  const pool = REPLIES[currentConv.id] || ['ok','dale','👍'];
  const text = pool[Math.floor(Math.random()*pool.length)];
  const msgs = JSON.parse(localStorage.getItem('vex_chat_'+currentConv.id) || '[]');
  const now  = new Date();
  msgs.push({
    from: currentConv.id,
    text,
    time: now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0'),
    date:'Hoy'
  });
  localStorage.setItem('vex_chat_'+currentConv.id, JSON.stringify(msgs));
  renderMessages();
  renderConvList();
  scheduleTyping();
}

/* ── Reactions ── */
function quickReact(idx, emoji){
  const msgs = JSON.parse(localStorage.getItem('vex_chat_'+currentConv.id) || '[]');
  const msg  = msgs[idx];
  if(!msg) return;
  msg.reactions = msg.reactions || [];
  const existing = msg.reactions.find(r=>r.e===emoji);
  if(existing){ existing.n++; existing.mine=true; }
  else msg.reactions.push({e:emoji,n:1,mine:true});
  localStorage.setItem('vex_chat_'+currentConv.id, JSON.stringify(msgs));
  renderMessages();
}
function addReaction(idx,emoji){ quickReact(idx,emoji); }
function openReactMenu(idx){
  quickReact(idx,'❤️');
}

/* ── Delete message ── */
function deleteMsg(idx){
  const msgs = JSON.parse(localStorage.getItem('vex_chat_'+currentConv.id) || '[]');
  msgs.splice(idx,1);
  localStorage.setItem('vex_chat_'+currentConv.id, JSON.stringify(msgs));
  renderMessages();
}

/* ── Emoji picker ── */
const EMOJIS=['🎮','🎯','🔥','💎','⚡','🏆','👑','🎬','🧱','🔫','⚔️','💪','👏','😂','😭','😤','🤯','💀','🫡','🥶'];
document.getElementById('emojiPicker').innerHTML = EMOJIS.map(e=>
  `<div class="e-option" onclick="insertEmoji('${e}')">${e}</div>`
).join('');

function toggleEmoji(){
  document.getElementById('emojiPicker').classList.toggle('open');
}
function insertEmoji(e){
  const input = document.getElementById('msgInput');
  input.value += e;
  input.focus();
  document.getElementById('emojiPicker').classList.remove('open');
}
document.addEventListener('click', e => {
  if(!e.target.closest('.emoji-btn') && !e.target.closest('#emojiPicker'))
    document.getElementById('emojiPicker').classList.remove('open');
});

function openProfile(){
  if(currentConv?.type==='dm') window.location.href='profile.html';
  else window.location.href='clan.html';
}
function newConv(){ alert('Busca un jugador en Explorar y envíale una solicitud.'); }

renderConvList();
</script>
